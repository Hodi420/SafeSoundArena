<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SafeSoundArena Demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <style>
      .game-board {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin: 20px 0;
      }
      .cell {
        aspect-ratio: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        background: #f0f0f0;
        cursor: pointer;
        border-radius: 8px;
        transition: all 0.2s;
      }
      .cell:hover {
        background: #e0e0e0;
      }
      .cell.x {
        color: #3b82f6;
      }
      .cell.o {
        color: #ef4444;
      }
      .status {
        font-size: 1.2rem;
        font-weight: bold;
        margin: 10px 0;
        min-height: 24px;
      }
      .chat-messages {
        height: 300px;
        overflow-y: auto;
        border: 1px solid #e5e7eb;
        padding: 10px;
        border-radius: 8px;
        margin: 10px 0;
      }
      .message {
        margin: 5px 0;
        padding: 8px 12px;
        border-radius: 8px;
        max-width: 70%;
      }
      .message.self {
        margin-left: auto;
        background: #3b82f6;
        color: white;
      }
      .message.other {
        margin-right: auto;
        background: #e5e7eb;
      }
      .message.system {
        margin: 5px auto;
        text-align: center;
        font-style: italic;
        color: #6b7280;
      }
    </style>
  </head>
  <body class="bg-gray-100 min-h-screen p-4">
    <div class="max-w-4xl mx-auto bg-white rounded-lg shadow-lg p-6">
      <h1 class="text-3xl font-bold text-center mb-6">SafeSoundArena Demo</h1>

      <div class="grid md:grid-cols-3 gap-6">
        <!-- Game Board -->
        <div class="md:col-span-2">
          <h2 class="text-xl font-semibold mb-4">Tic-Tac-Toe</h2>
          <div class="status" id="gameStatus">Connecting to server...</div>
          <div class="game-board" id="gameBoard">
            <!-- Cells will be generated by JavaScript -->
          </div>
          <div class="mt-4">
            <button
              id="newGameBtn"
              class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 disabled:opacity-50"
              disabled
            >
              New Game
            </button>
          </div>
        </div>

        <!-- Chat -->
        <div>
          <h2 class="text-xl font-semibold mb-4">Chat</h2>
          <div class="chat-messages" id="chatMessages">
            <div class="message system">Welcome to SafeSoundArena!</div>
          </div>
          <div class="mt-2 flex">
            <input
              type="text"
              id="chatInput"
              class="flex-1 border rounded-l px-3 py-2"
              placeholder="Type a message..."
              disabled
            />
            <button
              id="sendBtn"
              class="bg-blue-500 text-white px-4 py-2 rounded-r hover:bg-blue-600 disabled:opacity-50"
              disabled
            >
              Send
            </button>
          </div>
        </div>
      </div>

      <!-- Connection Status -->
      <div class="mt-8 p-4 bg-gray-50 rounded-lg">
        <h2 class="text-lg font-semibold mb-2">Connection Status</h2>
        <div class="flex items-center">
          <div id="connectionStatus" class="w-3 h-3 rounded-full bg-gray-400 mr-2"></div>
          <span id="connectionText">Connecting...</span>
        </div>
        <div class="mt-2 text-sm text-gray-600">
          <div>Player ID: <span id="playerId">-</span></div>
          <div>Game ID: <span id="gameId">-</span></div>
        </div>
      </div>

      <!-- Debug Console -->
      <div
        class="mt-6 p-4 bg-gray-800 text-green-400 rounded-lg font-mono text-sm overflow-auto max-h-40"
      >
        <div id="debugLog">[System] Initializing...</div>
      </div>
    </div>

    <!-- SDK will be loaded from the local build -->
    <script src="../client-sdk/dist/safesoundarena-client.js"></script>
    <script src="app.js"></script>
  </body>
</html>
