apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base/deployment.yaml
- ../../base/service.yaml
- ../../base/configmap.yaml
- ../../base/secrets.yaml
- ../../base/hpa.yaml

namespace: safesoundarena-staging

# Staging-specific patches
patches:
- target:
    kind: Deployment
    name: safesoundarena-api
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
    - op: replace
      path: /spec/template/spec/containers/0/image
      value: YOUR_REGISTRY/safesoundarena-api:staging
    - op: replace
      path: /spec/template/spec/containers/0/env/2/value
      value: info

# Staging replicas
replicas:
- name: safesoundarena-api
  count: 2

# Staging environment variables
configMapGenerator:
- name: safesoundarena-config
  behavior: merge
  literals:
  - NODE_ENV=staging
  - LOG_LEVEL=info

# Image registry for staging
images:
- name: safesoundarena-api
  newRegistry: YOUR_REGISTRY
  newTag: staging
