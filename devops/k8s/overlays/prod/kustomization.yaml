apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base/deployment.yaml
- ../../base/service.yaml
- ../../base/configmap.yaml
- ../../base/secrets.yaml
- ../../base/hpa.yaml
- ingress.yaml

namespace: safesoundarena

# Production-specific patches
patches:
- target:
    kind: Deployment
    name: safesoundarena-api
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
    - op: replace
      path: /spec/template/spec/containers/0/image
      value: YOUR_REGISTRY/safesoundarena-api:latest
    - op: replace
      path: /spec/template/spec/containers/0/env/2/value
      value: warn

# Production replicas
replicas:
- name: safesoundarena-api
  count: 3

# Production environment variables
configMapGenerator:
- name: safesoundarena-config
  behavior: merge
  literals:
  - NODE_ENV=production
  - LOG_LEVEL=warn

# Image registry for production
images:
- name: safesoundarena-api
  newRegistry: YOUR_REGISTRY
  newTag: latest
