apiVersion: v1
kind: Service
metadata:
  name: safesoundarena-api
  namespace: safesoundarena
  labels:
    app: safesoundarena
    component: api
spec:
  type: ClusterIP
  selector:
    app: safesoundarena
    component: api
  ports:
  - name: http
    port: 4000
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  sessionAffinity: None
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: safesoundarena-api
  namespace: safesoundarena
spec:
  podSelector:
    matchLabels:
      app: safesoundarena
      component: api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: safesoundarena
    ports:
    - protocol: TCP
      port: 4000
    - protocol: TCP
      port: 9090
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - podSelector:
        matchLabels:
          app: clickhouse
    ports:
    - protocol: TCP
      port: 9000
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
