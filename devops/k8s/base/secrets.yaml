  PI_API_KEY: eW91cl9waV9hcGlfa2V5X2hlcmU=  # your_pi_api_key_here
  OPENAI_API_KEY: eW91cl9vcGVuYWlfdGV4dF9hcGlfa2V5X2hlcmU=  # your_openai_api_key_here
  ADMIN_TOKEN: eW91cl9zZWN1cmVfYWRtaW5fdG9rZW5faGVyZQ==  # your_secure_admin_token_here
  JWT_SECRET: eW91cl9qd3Rfc2VjcmV0X2tleV9oZXJl  # your_jwt_secret_key_here
  DATABASE_URL: bW9uZ29kYjovL3JvOmNoYW5nZW1lQHBvc3RncmVzOjU0MzIvc2FmZXNvdW5kYXJlbmE=  # mongodb://ro:changeme@postgres:5432/safesoundarena
  DATABASE_PASSWORD: Y2hhbmdlbWU=  # changeme
  REDIS_PASSWORD: eW91cl9yZWRpc19wYXNzd29yZF9oZXJl  # your_redis_password_here
  CLICKHOUSE_PASSWORD: eW91cl9jbGlja2hvdXNlX3Bhc3N3b3JkX2hlcmU=  # your_clickhouse_password_here
  ETH_RPC_URL: aHR0cHM6Ly9tYWluLmluZnVyYS5pby92My95b3VyX2luZnVyYV9rZXk=  # https://mainnet.infura.io/v3/your_infura_key
  PRIVATE_KEY: eW91cl9wcml2YXRlX2tleV9oZXJl  # your_private_key_here
