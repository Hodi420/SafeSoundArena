  AWS_SECRET_ACCESS_KEY: eW91cl9hd3Nfc2VjcmV0  # your_aws_secret

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: safesoundarena
  namespace: safesoundarena

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: safesoundarena
  namespace: safesoundarena
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: safesoundarena
  namespace: safesoundarena
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: safesoundarena
subjects:
- kind: ServiceAccount
  name: safesoundarena
  namespace: safesoundarena
