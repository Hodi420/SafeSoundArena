apiVersion: v1
kind: ConfigMap
metadata:
  name: safesoundarena-config
  namespace: safesoundarena
data:
  NODE_ENV: "production"
  PORT: "4000"
  LOG_LEVEL: "info"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  CLICKHOUSE_HOST: "clickhouse"
  CLICKHOUSE_PORT: "9000"
  DATABASE_HOST: "postgres"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "safesoundarena"
  IPFS_HOST: "ipfs"
  IPFS_PORT: "5001"
  PROMETHEUS_ENABLED: "true"
  ENABLE_JAILTIME: "true"
  ENABLE_MARKETPLACE: "true"
  ENABLE_NFT_MINTING: "true"
