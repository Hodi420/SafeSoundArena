apiVersion: apps/v1
kind: HorizontalPodAutoscaler
metadata:
  name: safesoundarena-api-hpa
  namespace: safesoundarena
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: safesoundarena-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 4
        periodSeconds: 15
      selectPolicy: Max

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: safesoundarena-api-pdb
  namespace: safesoundarena
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: safesoundarena
      component: api
