# Opsgenie Configuration for SafeSoundArena
# This file contains the Opsgenie integration settings

# API Configuration
api:
  # Opsgenie API key (store this in environment variables in production)
  key: ${OPSGENIE_API_KEY}
  # API URL (EU or US region)
  url: "https://api.opsgenie.com/v2"

# Alert Routing
routing:
  # Default team to route alerts to
  default_team: "platform"
  
  # Route alerts based on tags or other criteria
  routes:
    - match:
        - field: "tags"
          values: ["security", "auth"]
      team: "security"
      priority: "P1"
      
    - match:
        - field: "tags"
          values: ["performance", "latency"]
      team: "sre"
      priority: "P2"
      
    - match:
        - field: "tags"
          values: ["billing", "payment"]
      team: "bizops"
      priority: "P2"

# Alert Priority Levels
priorities:
  P1: # Critical - Immediate attention required
    description: "Critical impact - Immediate attention required"
    responders:
      - type: "team"
        name: "${team}-oncall"
      - type: "escalation"
        name: "${team}-escalation"
    tags: ["critical"]
    
  P2: # High - Attention required during business hours
    description: "High impact - Attention required"
    responders:
      - type: "team"
        name: "${team}-oncall"
    tags: ["high"]
    
  P3: # Medium - Attention required during business hours
    description: "Medium impact - Attention required during business hours"
    responders:
      - type: "team"
        name: "${team}-business"
    tags: ["medium"]

# Notification Rules
notifications:
  # Alert notifications
  alert:
    - type: "email"
      send_to: "${team}@example.com"
      
    - type: "sms"
      send_to: "${team}-oncall"
      
    - type: "push"
      send_to: "${team}-oncall"
  
  # Incident notifications
  incident:
    - type: "email"
      send_to: "incidents@example.com"
    - type: "slack"
      send_to: "incidents"

# Schedules
schedules:
  # Primary on-call schedule
  primary:
    name: "Primary On-Call"
    timezone: "America/New_York"
    enabled: true
    
    # Rotation configuration
    rotation:
      type: "weekly"  # daily, weekly, or hourly
      start_date: "2023-01-01T00:00:00Z"
      length: 1       # Number of days/weeks/hours in rotation
      
      # Participants in the rotation
      participants:
        - user: "alice@example.com"
          position: 1
        - user: "bob@example.com"
          position: 2
    
    # Restrictions (e.g., business hours only)
    restrictions:
      - start_day: "monday"
        start_time: "09:00"
        end_day: "friday"
        end_time: "17:00"

# Escalation Policies
escalations:
  # Default escalation policy
  default:
    name: "Default Escalation"
    rules:
      - delay: 0
        notify:
          - type: "user"
            user: "${owner}"
          - type: "team"
            team: "${team}-oncall"
      - delay: 15  # minutes
        notify:
          - type: "team"
            team: "${team}-escalation"
      - delay: 30  # minutes
        notify:
          - type: "user"
            user: "cto@example.com"

# Heartbeat Monitoring
heartbeats:
  auth_service:
    name: "Auth Service"
    interval: 300  # seconds
    interval_unit: "minutes"
    enabled: true
    description: "Heartbeat for authentication service"
    owner_team:
      name: "platform"
    alert_message: "Auth Service heartbeat failed"
    alert_tags: ["critical", "auth"]
    alert_priority: "P1"

# API Integration
integrations:
  prometheus:
    name: "Prometheus"
    type: "Prometheus"
    enabled: true
    
  grafana:
    name: "Grafana"
    type: "Grafana"
    enabled: true
    
  pagerduty:
    name: "PagerDuty"
    type: "PagerDuty"
    enabled: true

# Maintenance Windows
maintenance:
  - name: "Scheduled Maintenance"
    start_time: "2023-06-15T02:00:00Z"
    end_time: "2023-06-15T04:00:00Z"
    description: "Planned maintenance window for database updates"
    teams: ["platform", "database"]
    state: "planned"

# Alert Templates
templates:
  security_alert:
    message: "{{.Message | truncate 100}}"
    alias: "{{.AlertName}}-{{.Fingerprint}}"
    description: |
      {{.Description}}
      
      **Status**: {{.Status}}
      **Severity**: {{.Severity}}
      **Environment**: {{.Environment}}
      
      {{if .Labels}}
      **Labels**:
      {{range $key, $value := .Labels}}
      - {{$key}}: {{$value}}
      {{end}}
      {{end}}
      
      {{if .Annotations}}
      **Details**:
      {{range $key, $value := .Annotations}}
      - {{$key}}: {{$value}}
      {{end}}
      {{end}}
    
    tags:
      - "{{.Status}}"
      - "{{.Severity}}"
      - "{{.Environment}}"
      
    details:
      status: "{{.Status}}"
      severity: "{{.Severity}}"
      environment: "{{.Environment}}"
      
    priority: "{{if eq .Severity "critical"}}P1{{else if eq .Severity "warning"}}P2{{else}}P3{{end}}"
