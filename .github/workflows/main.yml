name: SafeSoundArena CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Print Node/npm environment
        run: |
          node -v
          npm -v
          which node || where.exe node

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Run linting
        run: |
          # Run root lint only if a lint script exists
          if npm run | grep -q "lint"; then
            echo "Running root lint"
            npm run lint || true
          else
            echo "No root lint script, skipping"
          fi

          # Run frontend lint if present
          if [ -d frontend ] && jq -e '.scripts.lint' frontend/package.json >/dev/null 2>&1; then
            echo "Running frontend lint"
            (cd frontend && npm run lint) || true
          else
            echo "No frontend lint script found, skipping"
          fi

      - name: Run tests
        run: |
          npm run test
          (cd frontend && npm run test)

      - name: Upload test coverage
        uses: actions/upload-artifact@v3
        with:
          name: coverage
          path: coverage/

  security-scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
  - uses: actions/checkout@v4
      
      - name: Run SAST
        uses: github/codeql-action/analyze@v2

      - name: Run dependency scan (optional)
        if: ${{ secrets.SNYK_TOKEN != '' }}
        uses: snyk/actions/node@v1
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Run container scan (only if images built)
        if: ${{ env.IMAGE_NAME != '' }}
        uses: aquasecurity/trivy-action@v1
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  build:
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    steps:
  - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Login to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push API image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Build and push Frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    environment: staging
    steps:
  - uses: actions/checkout@v4
      
      - name: Set up Kubernetes tools
        uses: azure/setup-kubectl@v3
        
      - name: Configure AWS credentials (if secrets set)
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
          
      - name: Update kustomization (if overlay exists)
        run: |
          if [ -d k8s/overlays/staging ]; then
            cd k8s/overlays/staging
            kustomize edit set image api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:${{ github.sha }}
            kustomize edit set image frontend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}
          else
            echo "k8s overlays for staging not found, skipping kustomize edit"
          fi
          
      - name: Deploy to staging
        run: |
          aws eks update-kubeconfig --name staging-cluster
          kustomize build k8s/overlays/staging | kubectl apply -f -
          
      - name: Run integration tests
        run: npm run test:integration
        env:
          TEST_API_URL: https://staging-api.safesoundarena.io

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    if: github.ref == 'refs/heads/main'
    steps:
  - uses: actions/checkout@v4
      
      - name: Set up Kubernetes tools
        uses: azure/setup-kubectl@v3
        
      - name: Configure AWS credentials (if secrets set)
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
          
      - name: Update kustomization (if overlay exists)
        run: |
          if [ -d k8s/overlays/production ]; then
            cd k8s/overlays/production
            kustomize edit set image api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:${{ github.sha }}
            kustomize edit set image frontend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}
          else
            echo "k8s overlays for production not found, skipping kustomize edit"
          fi
          
      - name: Deploy to production
        run: |
          aws eks update-kubeconfig --name production-cluster
          kustomize build k8s/overlays/production | kubectl apply -f -
          
      - name: Verify deployment
        run: |
          kubectl rollout status deployment/api -n safesoundarena
          kubectl rollout status deployment/frontend -n safesoundarena
          
      - name: Run smoke tests
        run: npm run test:smoke
        env:
          TEST_API_URL: https://api.safesoundarena.io 