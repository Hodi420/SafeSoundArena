name: SafeSoundArena CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci-hygiene:
    name: CI hygiene — action pins & secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflows
        uses: actions/checkout@v4.3.0
        with:
          fetch-depth: 0

      - name: Scan workflows for disallowed pins
        run: |
          bash ./scripts/check-workflows.sh

      - name: Validate critical secrets (only on push or manual runs)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          bash ./scripts/validate-secrets.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Print Node/npm environment
        run: |
          node -v
          npm -v
          which node || where.exe node

      - name: Install dependencies
        run: |
          npm ci
          if [ -d frontend ]; then (cd frontend && npm ci); fi

      - name: Run linting (root + frontend if present)
        run: |
          if npm run | grep -q "lint"; then npm run lint || true; fi
          if [ -d frontend ] && jq -e '.scripts.lint' frontend/package.json >/dev/null 2>&1; then (cd frontend && npm run lint) || true; fi

      - name: Run tests
        run: |
          npm run test || true
          if [ -d frontend ]; then (cd frontend && npm run test) || true; fi

      - name: Upload test coverage
        uses: actions/upload-artifact@v3.1.2
        with:
          name: coverage
          path: coverage/

  security-scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.0

      - name: Run SAST (CodeQL)
        uses: github/codeql-action/analyze@v2.3.0

      - name: Run dependency scan (optional)
        if: ${{ secrets.SNYK_TOKEN != '' }}
        uses: snyk/actions@0.4.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Run container scan (only if images built)
        if: ${{ env.IMAGE_NAME != '' }}
        uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  build:
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Validate registry credentials
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$GITHUB_TOKEN" ] && [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "ERROR: No registry credentials found. Set GITHUB_TOKEN or DOCKERHUB_TOKEN as a secret. Aborting."
            exit 1
          fi
          echo "Registry credentials found."

      - name: Login to Container Registry
        uses: docker/login-action@v3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6.18.0
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.0

      - name: Set up Kubernetes tools
        uses: azure/setup-kubectl@v4.0.1

      - name: Validate required deploy secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "ERROR: Missing AWS credentials (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY). Aborting deployment to staging."
            exit 1
          fi
          echo "AWS credentials present."

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update kustomization (if overlay exists)
        run: |
          if [ -d k8s/overlays/staging ]; then
            cd k8s/overlays/staging
            kustomize edit set image api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:${{ github.sha }}
            kustomize edit set image frontend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}
          else
            echo "k8s overlays for staging not found, skipping kustomize edit"
          fi

      - name: Deploy to staging
        run: |
          aws eks update-kubeconfig --name staging-cluster
          kustomize build k8s/overlays/staging | kubectl apply -f -

      - name: Run integration tests
        run: npm run test:integration || true
        env:
          TEST_API_URL: https://staging-api.safesoundarena.io

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.0

      - name: Set up Kubernetes tools
        uses: azure/setup-kubectl@v4.0.1

      - name: Validate required deploy secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "ERROR: Missing AWS credentials (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY). Aborting production deployment."
            exit 1
          fi
          echo "AWS credentials present."

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update kustomization (if overlay exists)
        run: |
          if [ -d k8s/overlays/production ]; then
            cd k8s/overlays/production
            kustomize edit set image api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:${{ github.sha }}
            kustomize edit set image frontend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}
          else
            echo "k8s overlays for production not found, skipping kustomize edit"
          fi

      - name: Deploy to production
        run: |
          aws eks update-kubeconfig --name production-cluster
          kustomize build k8s/overlays/production | kubectl apply -f -

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/api -n safesoundarena || true
          kubectl rollout status deployment/frontend -n safesoundarena || true

      - name: Run smoke tests
        run: npm run test:smoke || true
        env:
          TEST_API_URL: https://api.safesoundarena.io
