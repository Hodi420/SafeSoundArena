name: Check for Duplicate/Temp Files

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  dupe-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Ensure latest git
        run: git --version

      - name: Debug git environment
        run: |
          echo "--- ls -la .git ---"
          ls -la .git || true
          echo "--- cat .git (if file) ---"
          if [ -f .git ]; then cat .git || true; fi
          echo "--- git status ---"
          git status || true
          echo "--- git rev-parse --git-dir ---"
          git rev-parse --git-dir || true
      - name: Find duplicate/temp files
        run: |
          matches=$(git ls-files | grep -E '(~$|\.tmp$|\.temp$|\.bak$|\.old$|\.orig$|\.backup$| \(1\)| \(2\)| \(copy\)|duplicate|\.swp$|\.swo$|\.log$|Thumbs\.db|\.DS_Store$)' || true)
          if [ -n "$matches" ]; then
            echo 'Found duplicate/temp files:'
            echo "$matches"
            exit 1
          else
            echo 'No duplicate/temp files found.'
          fi
