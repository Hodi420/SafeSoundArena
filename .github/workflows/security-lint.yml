name: Security & Lint Checks

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["*"]

jobs:
  security-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Debug git environment
        run: |
          echo "--- ls -la .git ---"
          ls -la .git || true
          echo "--- cat .git (if file) ---"
          if [ -f .git ]; then cat .git || true; fi
          echo "--- git status ---"
          git status || true
          echo "--- git rev-parse --git-dir ---"
          git rev-parse --git-dir || true
          echo "--- git config --list --show-origin ---"
          git config --list --show-origin || true
          echo "--- env GIT/CI/GITHUB vars ---"
          env | grep -i "GIT\|CI\|GITHUB" || true
      - name: Ensure latest git
        run: git --version
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: |
          if [ -f ./node_modules/.bin/eslint ]; then
            npx eslint . || true
          else
            echo "ESLint not found, skipping lint step."
          fi
      - name: Run npm audit
        run: |
          npm audit --audit-level=critical || true
