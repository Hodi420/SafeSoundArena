name: MCP Server CI
on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/mcp.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/mcp.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - name: Install
        run: npm ci --prefix server
      - name: Lint (skip if none)
        run: |
          if [ -f server/.eslintrc || -f .eslintrc || -f .eslintrc.json ]; then
            npx --yes eslint server
          else
            echo "No ESLint config, skipping"
          fi
      - name: Build Docker
        run: docker build -t safesoundarena/mcp:ci ./server
