services:
  api-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '4000:4000'
    environment:
      - PI_API_KEY=${PI_API_KEY}
      - NODE_ENV=development
      - PORT=4000
      - ADMIN_TOKEN=${ADMIN_TOKEN:?ADMIN_TOKEN is required}
      - ALLOWED_ORIGINS=http://localhost:3000
      - SAFESOUND_DATA_DIR=/app/data
    volumes:
      - .:/app
      - /app/node_modules
      - feature_data:/app/data
    networks:
      - sa-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - BACKEND_URL=http://api-server:4000
    depends_on:
      api-server:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - sa-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:3000"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  sa-network:
    driver: bridge

volumes:
  feature_data: {}
