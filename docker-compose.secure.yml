version: '3.8'

services:
  api-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: safesoundarena/api-server:secure
    container_name: ssa-api-server
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SIGNING_KEY=${SIGNING_KEY}
      - MASTER_LICENSE_KEY=${MASTER_LICENSE_KEY}
      - INSTANCE_ID=${INSTANCE_ID}
      - LICENSE_ID=${LICENSE_ID}
      - LICENSE_SERVER=${LICENSE_SERVER}
      - ENABLE_CODE_INTEGRITY_CHECK=true
      - ENABLE_DIGITAL_WATERMARKS=true
      - ENABLE_DDOS_PROTECTION=true
      - RATE_LIMIT_MAX_REQUESTS=100
      - RATE_LIMIT_WINDOW_MS=60000
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - api_logs:/app/logs:rw
      - api_data:/app/data:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - sa-network
    depends_on:
      - redis
      - clickhouse
    security_opt:
      - no-new-privileges:true
      - seccomp:seccomp-enhanced.json
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ['CMD', 'node', 'healthcheck.js']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: safesoundarena/frontend:secure
    container_name: ssa-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3000
      - INSTANCE_ID=${INSTANCE_ID}
      - LICENSE_ID=${LICENSE_ID}
      - ENABLE_DIGITAL_WATERMARKS=true
    ports:
      - '127.0.0.1:3001:3000'
    volumes:
      - frontend_logs:/app/logs:rw
    networks:
      - sa-network
    depends_on:
      - api-server
    security_opt:
      - no-new-privileges:true
      - seccomp:seccomp-enhanced.json
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ['CMD', 'node', 'healthcheck.js']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: ssa-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme} --appendonly yes
    volumes:
      - redis_data:/data:rw
    networks:
      - sa-network
    security_opt:
      - no-new-privileges:true
    read_only: false
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 10s
      retries: 3

  clickhouse:
    image: clickhouse/clickhouse-server:23.3
    container_name: ssa-clickhouse
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse:rw
      - clickhouse_logs:/var/log/clickhouse-server:rw
    networks:
      - sa-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: ssa-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus:rw
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - sa-network
    security_opt:
      - no-new-privileges:true
    read_only: false
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana:10.0.3
    container_name: ssa-grafana
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana:rw
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=localhost
      - GF_SMTP_ENABLED=false
    networks:
      - sa-network
    depends_on:
      - prometheus
    security_opt:
      - no-new-privileges:true
    read_only: false
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  jaeger:
    image: jaegertracing/all-in-one:1.47
    container_name: ssa-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    networks:
      - sa-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:14269/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  mailhog:
    image: mailhog/mailhog:latest
    container_name: ssa-mailhog
    restart: unless-stopped
    networks:
      - sa-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ['CMD', 'nc', '-z', 'localhost', '1025']
      interval: 30s
      timeout: 10s
      retries: 3

  ganache:
    image: trufflesuite/ganache:latest
    container_name: ssa-ganache
    restart: unless-stopped
    command: --deterministic --mnemonic "test test test test test test test test test test test junk" --networkId 5777 --chain.chainId 1337
    networks:
      - sa-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: nc -z localhost 8545 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:1.25-alpine
    container_name: ssa-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/conf:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/www:/var/www/html:ro
      - nginx_logs:/var/log/nginx:rw
    networks:
      - sa-network
    depends_on:
      - api-server
      - frontend
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/run:rw,noexec,nosuid
      - /tmp:rw,noexec,nosuid
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      test: ['CMD', 'nginx', '-t']
      interval: 30s
      timeout: 10s
      retries: 3

  license-server:
    build:
      context: ./license-server
      dockerfile: Dockerfile
    image: safesoundarena/license-server:secure
    container_name: ssa-license-server
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SIGNING_KEY=${SIGNING_KEY}
      - ADMIN_PASSWORD=${LICENSE_ADMIN_PASSWORD:-changeme}
    volumes:
      - license_data:/app/data:rw
      - license_logs:/app/logs:rw
    networks:
      - sa-network
    security_opt:
      - no-new-privileges:true
      - seccomp:seccomp-enhanced.json
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ['CMD', 'node', 'healthcheck.js']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  sa-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
    driver_opts:
      com.docker.network.bridge.name: sa-net
      com.docker.network.driver.mtu: 1500
    labels:
      com.safesoundarena.description: 'SafeSoundArena secure network'

volumes:
  redis_data:
    name: ssa-redis-data
  clickhouse_data:
    name: ssa-clickhouse-data
  clickhouse_logs:
    name: ssa-clickhouse-logs
  prometheus_data:
    name: ssa-prometheus-data
  grafana_data:
    name: ssa-grafana-data
  api_logs:
    name: ssa-api-logs
  api_data:
    name: ssa-api-data
  frontend_logs:
    name: ssa-frontend-logs
  nginx_logs:
    name: ssa-nginx-logs
  license_data:
    name: ssa-license-data
  license_logs:
    name: ssa-license-logs
