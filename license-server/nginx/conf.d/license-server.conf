# תצורת Nginx לשרת רישיונות SafeSoundArena

# הגדרות בסיסיות
server {
    listen 443 ssl http2;
    server_name license.safesoundarena.com;
    
    # הגדרות SSL
    ssl_certificate /etc/nginx/ssl/license.safesoundarena.com.crt;
    ssl_certificate_key /etc/nginx/ssl/license.safesoundarena.com.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    # הגדרות אבטחת SSL מודרניות
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # HSTS (מומלץ להפעיל בסביבת ייצור)
    add_header Strict-Transport-Security "max-age=63072000" always;
    
    # כותרות אבטחה נוספות
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; img-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self';";
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";
    
    # לוגים
    access_log /var/log/nginx/license-access.log;
    error_log /var/log/nginx/license-error.log;
    
    # הגדרות גודל גוף בקשה
    client_max_body_size 1M;
    
    # הגדרות timeout
    client_body_timeout 10;
    client_header_timeout 10;
    keepalive_timeout 65;
    send_timeout 10;
    
    # הגנה מפני התקפות
    # הגבלת מספר חיבורים לכל IP
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
    limit_conn conn_limit_per_ip 10;
    
    # הגבלת קצב בקשות לכל IP
    limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=5r/s;
    limit_req zone=req_limit_per_ip burst=10 nodelay;
    
    # הפניית כל הבקשות לשרת הרישיונות
    location / {
        proxy_pass http://license-server:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # הגדרות timeout לפרוקסי
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # נקודת קצה לבדיקת בריאות
    location /healthz {
        proxy_pass http://license-server:3010/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # הגדרות מטמון לבדיקת בריאות
        proxy_cache_valid 200 10s;
        add_header X-Cache-Status $upstream_cache_status;
    }
    
    # חסימת גישה לקבצים רגישים
    location ~ /\.(?!well-known) {
        deny all;
    }
    
    # חסימת גישה לקבצי גיבוי ומערכת
    location ~ \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist)|~$ {
        deny all;
    }
}

# הפניית HTTP ל-HTTPS
server {
    listen 80;
    server_name license.safesoundarena.com;
    
    # הפניה קבועה ל-HTTPS
    return 301 https://$host$request_uri;
}