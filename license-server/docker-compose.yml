version: '3.8'

services:
  license-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: safesoundarena/license-server:latest
    container_name: safesoundarena-license-server
    restart: unless-stopped
    ports:
      - "3010:3010"
    environment:
      - NODE_ENV=production
      - LICENSE_SERVER_PORT=3010
      # אלו משתני סביבה רגישים שיש להגדיר בקובץ .env או להזריק בזמן ריצה
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SIGNING_KEY=${SIGNING_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    volumes:
      - license-data:/app/data
      - license-logs:/app/logs
    networks:
      - license-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3010/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    # הגבלות משאבים
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    # הגדרות אבטחה
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp

  # שירות Redis לניהול מטמון ומשימות (אופציונלי)
  redis:
    image: redis:7-alpine
    container_name: safesoundarena-license-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - license-network
    # הגבלות משאבים
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
    # הגדרות אבטחה
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # שירות Nginx כ-reverse proxy (אופציונלי)
  nginx:
    image: nginx:1.25-alpine
    container_name: safesoundarena-license-nginx
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - license-server
    networks:
      - license-network
    # הגבלות משאבים
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    # הגדרות אבטחה
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

volumes:
  license-data:
    driver: local
  license-logs:
    driver: local
  redis-data:
    driver: local
  nginx-logs:
    driver: local

networks:
  license-network:
    driver: bridge