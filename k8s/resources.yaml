apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-resources
  namespace: safesoundarena-staging
spec:
  hard:
    requests.cpu: '4'
    requests.memory: 8Gi
    limits.cpu: '8'
    limits.memory: 16Gi
    pods: '20'
    services: '10'
    configmaps: '20'
    secrets: '20'
    persistentvolumeclaims: '10'
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-resources
  namespace: safesoundarena-prod
spec:
  hard:
    requests.cpu: '16'
    requests.memory: 32Gi
    limits.cpu: '32'
    limits.memory: 64Gi
    pods: '50'
    services: '20'
    configmaps: '50'
    secrets: '50'
    persistentvolumeclaims: '20'
---
apiVersion: v1
kind: LimitRange
metadata:
  name: resource-limits
  namespace: safesoundarena-staging
spec:
  limits:
    - default:
        cpu: '500m'
        memory: '512Mi'
      defaultRequest:
        cpu: '200m'
        memory: '256Mi'
      type: Container
---
apiVersion: v1
kind: LimitRange
metadata:
  name: resource-limits
  namespace: safesoundarena-prod
spec:
  limits:
    - default:
        cpu: '1000m'
        memory: '1Gi'
      defaultRequest:
        cpu: '500m'
        memory: '512Mi'
      type: Container
