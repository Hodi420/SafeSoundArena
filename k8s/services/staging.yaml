apiVersion: v1
kind: Service
metadata:
  name: safesoundarena-web
  namespace: safesoundarena-staging
  labels:
    app: safesoundarena
    environment: staging
    tier: frontend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: safesoundarena
    environment: staging
    tier: frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: safesoundarena-ingress
  namespace: safesoundarena-staging
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: staging.safesoundarena.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: safesoundarena-web
            port:
              number: 80
