apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: safesoundarena-web
  namespace: safesoundarena-staging
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: safesoundarena-web
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 45
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: safesoundarena-web
  namespace: safesoundarena-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: safesoundarena-web-blue # Will be updated by the deployment script
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
    - type: External
      external:
        metric:
          name: http_requests_per_second
          selector:
            matchLabels:
              app: safesoundarena
        target:
          type: AverageValue
          averageValue: 1000
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 4
          periodSeconds: 30
        - type: Percent
          value: 50
          periodSeconds: 30
