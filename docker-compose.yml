services:
  api-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '${LAN_BIND_IP:-0.0.0.0}:4000:4000'
    environment:
      - NODE_ENV=production
      - PORT=4000
      - PI_API_KEY=${PI_API_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
    networks:
      - sa-network
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/api/health', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - '${LAN_BIND_IP:-0.0.0.0}:3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      api-server:
        condition: service_healthy
    networks:
      - sa-network
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 768m
    mem_reservation: 256m
    cpus: 1.5
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  ipfs:
    image: ipfs/kubo:v0.28.0
    ports:
      - '127.0.0.1:5001:5001'
      - '127.0.0.1:8080:8080'
    volumes:
      - ipfs_data:/data/ipfs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--post-data=", "http://127.0.0.1:5001/api/v0/version"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - sa-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

networks:
  sa-network:
    driver: bridge

volumes:
  ipfs_data: {}
